# site properties and page defaults
title: Language Processing and Usage Lab
#subtitle: 
#description:
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: aymeric.collart@ntnu.edu.tw
  orcid: 0000-0002-8902-0758
  google-scholar: jcjDynUAAAAJ
  #github: lpulab
  #twitter: lpulab
  #youtube: lpulab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - .Rproj.user
  - index.html
  - index_files
  - research/index.html
  - research/index_files
  - projects/index.html
  - projects/index_files
  - team/index.html
  - team/index_files
  - calendar/index.html
  - calendar/index_files
  - contact/index.html
  - contact/index_files
  - zh-tw/index.html
  - zh-tw/index_files
  - zh-tw/research/index.html
  - zh-tw/research/index_files
  - zh-tw/projects/index.html
  - zh-tw/projects/index_files
  - zh-tw/team/index.html
  - zh-tw/team/index_files
  - zh-tw/calendar/index.html
  - zh-tw/calendar/index_files
  - zh-tw/contact/index.html
  - zh-tw/contact/index_files
