  group: Projects-zh
  image: images/NSTC_2025.png
  description: "從形態句法與社會語言學視角，運用語料庫語言學方法探討臺灣華語語法標記（助動詞「有」及句尾助詞「過」）之使用情形的研究計畫。" 
  tags:
    - 研究計畫

